# Publishes a live, fully interactive preview of the site to GitHub Pages.
#
# `enablement: true` asks GitHub to switch Pages on for this repo the first
# time the workflow runs, so there is nothing to click. It only works on a
# public repo (or a paid plan) — Pages is unavailable on private repos on the
# free plan, and the API refuses there.
#
# If that step ever fails, turn Pages on by hand once:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Supplies base_path (e.g. /FVA-new-web), so the export's asset URLs
      # match wherever Pages actually serves the site from.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - run: npm ci

      - run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages would otherwise strip the underscore-prefixed _next directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
