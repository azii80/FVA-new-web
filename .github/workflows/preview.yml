# Publishes a live, fully interactive preview of the site to GitHub Pages.
#
# ONE-TIME SETUP (required once, cannot be automated):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The workflow token cannot create the Pages site itself. Tested both while the
# repo was private and after making it public: the API returns "Resource not
# accessible by integration" either way, so actions/configure-pages needs the
# site to already exist. After that one click, every push to main redeploys.
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Supplies base_path (e.g. /FVA-new-web), so the export's asset URLs
      # match wherever Pages actually serves the site from.
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - run: npm run build
        env:
          NEXT_EXPORT: "1"
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages would otherwise strip the underscore-prefixed _next directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
